services:
  - type: web
    name: gpads-codepath-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn app.config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: FRONTEND_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/firebase-service-account.json
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: GpadsTech
      - key: GITHUB_ALLOWED_REPOSITORIES
        value: GpadsTech/gpads-os-test
